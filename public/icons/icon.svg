<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lp-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <filter id="lp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base background (for maskable icon support) -->
  <rect width="512" height="512" rx="112" fill="url(#lp-bg)"/>

  <!-- Inner Badge Frame -->
  <rect x="40" y="40" width="432" height="432" rx="84" fill="url(#lp-card)" stroke="#2b2b32" stroke-width="4" filter="url(#lp-shadow)"/>
  
  <!-- Subtle accent detail -->
  <rect x="68" y="68" width="48" height="6" rx="3" fill="#3B82F6"/>

  <!-- Central "LP" Monogram -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="180" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">LP</text>

  <!-- Subtitle Text -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="6">LEAD PANTHER</text>
</svg>
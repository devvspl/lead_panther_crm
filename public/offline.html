<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead Panther CRM - Offline</title>
    <meta name="theme-color" content="#0A0A0A">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            background-color: #0A0A0A;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 380px;
            width: 100%;
            background: #141416;
            border: 1px solid #26262B;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo-box {
            width: 56px;
            height: 56px;
            background: #0A0A0A;
            border: 1px solid #333338;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #FFFFFF;
            margin: 0 auto 20px;
            letter-spacing: -0.5px;
        }
        h1 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 13px;
            color: #9CA3AF;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 20px;
            background: #FFFFFF;
            color: #0A0A0A;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .hint {
            font-size: 11px;
            color: #6B7280;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">LP</div>
        <h1>You are currently offline</h1>
        <p>Lead Panther CRM requires an internet connection to securely access real-time leads and pipeline updates.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
        <div class="hint">Check Wi-Fi or mobile data connection</div>
    </div>
</body>
</html>
